# Smart Sump MQTT broker (Mosquitto 2.x, runs in Docker).

# Keep retained messages (device status, set-points) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT: the ESP32 (or simulator) and the logger.
listener 1883
protocol mqtt

# MQTT over WebSocket: the browser dashboard.
listener 9001
protocol websockets

# Nobody gets in without the login from .env (entrypoint.sh builds this file).
allow_anonymous false
password_file /mosquitto/passwd
