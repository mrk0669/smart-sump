[pytest]
# Run `python -m pytest` from the repo root.
testpaths = simulator/tests logger/tests
# The simulator modules import each other by plain name (`import control`),
# exactly as when you run `python simulator/sim.py`. The repo root is on the
# path so the logger is importable as a package (`import logger`).
pythonpath = simulator .
# Keep test temp files inside the project (D:) rather than Windows Temp on C:,
# which is full on the development laptop. Git ignores this folder.
addopts = --basetemp=.pytest_tmp
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
